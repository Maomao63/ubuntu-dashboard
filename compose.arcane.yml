services:
  ubuntu-dashboard:
    image: ubuntu-dashboard:latest
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-alpine
        ARG APP_VERSION=1.0.0
        ENV APP_VERSION=$${APP_VERSION} PYTHONUNBUFFERED=1 PORT=8080 HOST_ROOT=/host
        WORKDIR /app
        RUN mkdir -p /app && echo '' | base64 -d | tar -xz -C /app
        EXPOSE 8080
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 CMD wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1
        CMD ["python3", "/app/server.py"]
    container_name: ubuntu-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: "1.0.0"
      DASHBOARD_USER: "mao"
      DASHBOARD_PASSWORD: "qwer"
      ALLOW_DOCKER_ACTIONS: "true"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
