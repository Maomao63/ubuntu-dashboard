services:
  ubuntu-dashboard:
    image: ubuntu-dashboard:latest
    build:
      context: .
      args:
        APP_VERSION: "1.5.0"
    container_name: ubuntu-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      ALLOW_DOCKER_ACTIONS: "${ALLOW_DOCKER_ACTIONS:-true}"
      SHARE_ROOTS: "${SHARE_ROOTS:-}"
      SSH_HOST: "${SSH_HOST:-host.docker.internal}"
      SSH_PORT: "${SSH_PORT:-22}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SESSION_TTL: "${SESSION_TTL:-43200}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ubuntu-dashboard-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777

volumes:
  ubuntu-dashboard-data:
